{% extends 'base.html' %}
{% load static %}

{% block title %}Quick Notes{% endblock %}

{% block extra_head %}
<!-- Babel Standalone for JSX transformation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<!-- React and ReactDOM -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
{% endblock %}

{% block content %}
<div class="flex-1 p-6">
    <div class="max-w-4xl mx-auto">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Quick Notes</h1>
            <p class="text-gray-600">Simple note-taking tool</p>
        </div>
        
        <!-- React App Mount Point -->
        <div id="notes-app" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <!-- Loading state -->
            <div class="text-center text-gray-500">
                Loading notes app...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="text/babel" src="{% static 'js/notes-app.jsx' %}"></script>
{% endblock %}
